name: Recitation simulation

on:
  workflow_dispatch:
  push:
    paths: ['sim/**', 'src/lib/**', '.github/workflows/sim.yml']

jobs:
  sim:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - run: ./sim/run_sim.sh
