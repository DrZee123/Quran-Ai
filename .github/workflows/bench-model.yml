name: Benchmark speech models

on:
  workflow_dispatch:
  push:
    paths: ['scripts/bench_*']

jobs:
  bench:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - run: ./scripts/bench_models.sh
