name: Build Android APK

# Builds an installable APK without needing an Expo account.
# Download it from the run's "Artifacts" section, or from the "latest-apk" release (main branch).
on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: write

concurrency:
  group: apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - run: npm ci
      - name: Generate native project
        run: npx expo prebuild --platform android --no-install
      - name: Build release APK (arm64 phones)
        working-directory: android
        run: ./gradlew assembleRelease -PreactNativeArchitectures=arm64-v8a --no-daemon
      - name: Rename
        run: cp android/app/build/outputs/apk/release/app-release.apk hifz-saathi.apk
      - uses: actions/upload-artifact@v4
        with:
          name: hifz-saathi-apk
          path: hifz-saathi.apk
      - name: Publish to latest-apk release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view latest-apk >/dev/null 2>&1 || \
            gh release create latest-apk --title "Latest APK" --notes "Har main push par khud update hota hai." --prerelease
          gh release upload latest-apk hifz-saathi.apk --clobber
